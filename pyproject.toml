[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p-redis-limiter"
version = "0.1.0"
description = "A fast, atomic, multi-tier Token Bucket rate limiter for Python and FastAPI using Redis."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Mehran" }
]
keywords = ["redis", "rate-limiter", "token-bucket", "fastapi", "throttling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]
dependencies = [
    "redis>=4.2.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.70.0",
    "starlette>=0.14.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "httpx>=0.23.0",
    "fastapi>=0.70.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["p_redis_limiter*"]

[tool.setuptools.package-data]
p_redis_limiter = ["py.typed"]
